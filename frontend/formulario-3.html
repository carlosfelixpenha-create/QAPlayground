<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QAPlayground - Formulário 3</title>
    <link rel="stylesheet" href="style_global.css" />
    <link rel="stylesheet" href="login.css" />
    <style>
      input.erro {
        border: 2px solid red;
      }
    </style>
  </head>
  <body>
    <div class="login-content">
      <h1>Formulário 3 - Novos Campos</h1>
      <form
        onsubmit="executarFormulario3(event)"
        class="form-container"
        novalidate
      >
        <!-- Upload PDF -->
        <div class="field-container">
          <label for="arquivoPdf">Upload de Arquivo (PDF)*:</label>
          <input type="file" id="arquivoPdf" />
        </div>

        <!-- Upload DOCX -->
        <div class="field-container">
          <label for="arquivoDocx">Upload de Arquivo (DOCX)*:</label>
          <input type="file" id="arquivoDocx" />
        </div>

        <!-- Upload JPG -->
        <div class="field-container">
          <label for="arquivoJpg">Upload de Arquivo (JPG)*:</label>
          <input type="file" id="arquivoJpg" />
        </div>

        <!-- Upload XLSX -->
        <div class="field-container">
          <label for="arquivoXlsx">Upload de Arquivo (XLSX)*:</label>
          <input type="file" id="arquivoXlsx" />
        </div>

        <!-- Upload TXT -->
        <div class="field-container">
          <label for="arquivoTxt">Upload de Arquivo (TXT)*:</label>
          <input type="file" id="arquivoTxt" />
        </div>

        <!-- Select País / Estado / Cidade -->
        <div class="field-container">
          <label for="pais">País*:</label>
          <select id="pais" required>
            <option value="">Selecione...</option>
            <option value="brasil">Brasil</option>
            <option value="portugal">Portugal</option>
            <option value="eua">Estados Unidos</option>
          </select>

          <label for="estado">Estado*:</label>
          <select id="estado" required>
            <option value="">Selecione...</option>
          </select>

          <label for="cidade">Cidade*:</label>
          <select id="cidade" required>
            <option value="">Selecione...</option>
          </select>
        </div>

        <div class="button-group">
          <button
            type="button"
            class="requisitos"
            onclick="location.href='formulario-3-requisitos.html'"
          >
            Requisitos
          </button>
          <button type="button" onclick="location.href='home.html'">
            Voltar
          </button>
          <button type="submit">Enviar</button>
        </div>
      </form>
    </div>

    <!-- Modal genérica -->
    <div id="modalMensagem" class="modal" style="display: none">
      <div class="modal-content">
        <span id="modalFechar" class="close">&times;</span>
        <p id="modalTexto"></p>
        <div class="modal-actions">
          <button id="modalOk" type="button" class="btn-ok">OK</button>
        </div>
      </div>
    </div>
    <script>
      const dadosLocalizacao = {
        brasil: {
          pr: { label: "Paraná", cidades: ["Curitiba", "Matinhos"] },
          sp: {
            label: "São Paulo",
            cidades: ["São Paulo", "Campinas", "Santos"],
          },
          rj: {
            label: "Rio de Janeiro",
            cidades: ["Rio de Janeiro", "Niterói"],
          },
        },
        portugal: {
          lisboa: { label: "Lisboa", cidades: ["Lisboa", "Sintra"] },
          porto: { label: "Porto", cidades: ["Porto", "Gaia"] },
        },
        eua: {
          ny: { label: "Nova Iorque", cidades: ["Nova Iorque", "Buffalo"] },
          ca: {
            label: "Califórnia",
            cidades: ["Los Angeles", "San Francisco"],
          },
        },
      };

      function mostrarModal(mensagem) {
        const modal = document.getElementById("modalMensagem");
        const modalTexto = document.getElementById("modalTexto");
        modalTexto.textContent = mensagem;
        modal.style.display = "block";

        document.getElementById("modalOk").onclick = () => {
          modal.style.display = "none";
        };
        document.getElementById("modalFechar").onclick = () => {
          modal.style.display = "none";
        };
        window.onclick = (event) => {
          if (event.target === modal) {
            modal.style.display = "none";
          }
        };
      }

      function validarArquivo(input, tipoEsperado, mensagemErro) {
        input.addEventListener("change", () => {
          const arquivo = input.files[0];
          if (arquivo && arquivo.type !== tipoEsperado) {
            mostrarModal(mensagemErro);
            input.classList.add("erro");
          } else {
            input.classList.remove("erro");
          }
        });
      }

      document.addEventListener("DOMContentLoaded", () => {
        const paisSelect = document.getElementById("pais");
        const estadoSelect = document.getElementById("estado");
        const cidadeSelect = document.getElementById("cidade");

        paisSelect.addEventListener("change", () => {
          const pais = paisSelect.value;
          estadoSelect.innerHTML = '<option value="">Selecione...</option>';
          cidadeSelect.innerHTML = '<option value="">Selecione...</option>';

          if (pais && dadosLocalizacao[pais]) {
            Object.entries(dadosLocalizacao[pais]).forEach(
              ([estadoKey, estadoObj]) => {
                const opt = document.createElement("option");
                opt.value = estadoKey;
                opt.textContent = estadoObj.label;
                estadoSelect.appendChild(opt);
              }
            );
          }
        });

        estadoSelect.addEventListener("change", () => {
          const pais = paisSelect.value;
          const estado = estadoSelect.value;
          cidadeSelect.innerHTML = '<option value="">Selecione...</option>';

          if (pais && estado && dadosLocalizacao[pais][estado]) {
            dadosLocalizacao[pais][estado].cidades.forEach((cidade) => {
              const opt = document.createElement("option");
              opt.value = cidade.toLowerCase().replace(/\s+/g, "-");
              opt.textContent = cidade;
              cidadeSelect.appendChild(opt);
            });
          }
        });

        // Validação imediata
        validarArquivo(
          document.getElementById("arquivoPdf"),
          "application/pdf",
          "Campo para arquivo PDF, dúvidas entrar em requisitos!"
        );
        validarArquivo(
          document.getElementById("arquivoDocx"),
          "application/vnd.openxmlformats-officedocument.wordprocessingml.document",
          "Campo para arquivo DOCX, dúvidas entrar em requisitos!"
        );
        validarArquivo(
          document.getElementById("arquivoJpg"),
          "image/jpeg",
          "Campo para arquivo JPG, dúvidas entrar em requisitos!"
        );
        validarArquivo(
          document.getElementById("arquivoXlsx"),
          "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",
          "Campo para arquivo XLSX, dúvidas entrar em requisitos!"
        );
        validarArquivo(
          document.getElementById("arquivoTxt"),
          "text/plain",
          "Campo para arquivo TXT, dúvidas entrar em requisitos!"
        );
      });

      function executarFormulario3(event) {
        event.preventDefault();

        const campos = [
          { id: "arquivoPdf", tipo: "application/pdf" },
          {
            id: "arquivoDocx",
            tipo: "application/vnd.openxmlformats-officedocument.wordprocessingml.document",
          },
          { id: "arquivoJpg", tipo: "image/jpeg" },
          {
            id: "arquivoXlsx",
            tipo: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",
          },
          { id: "arquivoTxt", tipo: "text/plain" },
        ];

        let erros = [];

        campos.forEach(({ id, tipo }) => {
          const input = document.getElementById(id);
          const arquivo = input.files[0];
          if (!arquivo || arquivo.type !== tipo) {
            input.classList.add("erro");
            erros.push(id);
          } else {
            input.classList.remove("erro");
          }
        });

        const paisSelect = document.getElementById("pais");
        const estadoSelect = document.getElementById("estado");
        const cidadeSelect = document.getElementById("cidade");

        if (!paisSelect.value || !estadoSelect.value || !cidadeSelect.value) {
          erros.push("localizacao");
        }

        if (erros.length > 0) {
          return mostrarModal(
            "Existem campos inválidos. Revalide os campos destacados em vermelho."
          );
        }

        mostrarModal("Formulário enviado com sucesso!");

        // Limpar os campos após sucesso
        document.querySelectorAll("input[type='file']").forEach((input) => {
          input.value = "";
          input.classList.remove("erro");
        });
        paisSelect.value = "";
        estadoSelect.innerHTML = '<option value="">Selecione...</option>';
        cidadeSelect.innerHTML = '<option value="">Selecione...</option>';
      }
    </script>

    <!-- Marca d'água -->
    <div class="marca-dagua esquerda"></div>
    <div class="marca-dagua direita"></div>
  </body>
</html>
