<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QAPlayground - Arrastar e Soltar</title>
    <link rel="stylesheet" href="../css/style_global.css" />
    <link rel="stylesheet" href="../css/login.css" />
    <link rel="stylesheet" href="../css/responsividade-global.css" />
  </head>
  <body class="arrastar-soltar">
    <div class="login-content">
      <h1>Arrastando Imagens</h1>

      <!-- Container principal -->
      <div class="form-container">
        <!-- Layout base -->
        <div
          id="game-container"
          style="display: grid; grid-template-columns: 1fr 1fr; gap: 24px"
        >
          <!-- Coluna das palavras -->
          <div id="coluna-palavras" class="field-container">
            <label>Arrastar</label><br />
            <div class="tag-palavra" draggable="true" data-tipo="ponte">
              Ponte
            </div>
            <div class="tag-palavra" draggable="true" data-tipo="morro">
              Morro
            </div>
            <div class="tag-palavra" draggable="true" data-tipo="barco">
              Barco
            </div>
            <div class="tag-palavra" draggable="true" data-tipo="casa">
              Casa
            </div>
            <div class="tag-palavra" draggable="true" data-tipo="campo">
              Campo
            </div>
            <div class="tag-palavra" draggable="true" data-tipo="predio">
              Prédios
            </div>
            <div class="tag-palavra" draggable="true" data-tipo="carro">
              Carro
            </div>
          </div>

          <!-- Coluna das imagens -->
          <div id="coluna-imagens" class="field-container">
            <label>Soltar</label>
            <div class="item-slot" data-tipo="casa">
              <img src="../img/arrastar_soltar/casa.jpg" alt="Casa" />
            </div>
            <div class="item-slot" data-tipo="campo">
              <img src="../img/arrastar_soltar/campo.jpg" alt="Campo" />
            </div>
            <div class="item-slot" data-tipo="morro">
              <img src="../img/arrastar_soltar/morro.jpg" alt="Morro" />
            </div>
            <div class="item-slot" data-tipo="predio">
              <img src="../img/arrastar_soltar/predio.jpg" alt="Prédio" />
            </div>
            <div class="item-slot" data-tipo="ponte">
              <img src="../img/arrastar_soltar/ponte.jpg" alt="Ponte" />
            </div>
            <div class="item-slot" data-tipo="carro">
              <img src="../img/arrastar_soltar/carro.jpg" alt="Carro" />
            </div>
            <div class="item-slot" data-tipo="barco">
              <img src="../img/arrastar_soltar/barco.jpg" alt="Barco" />
            </div>
          </div>
        </div>

        <!-- HUD de status -->
        <div
          id="hud"
          class="field-container"
          style="
            display: flex;
            gap: 16px;
            align-items: center;
            justify-content: flex-start;
            margin-top: 12px;
          "
        >
          <div><strong>Movimentos:</strong> <span id="movimentos">0</span></div>
          <div><strong>Acertos:</strong> <span id="acertos">0</span></div>
          <div><strong>Erros:</strong> <span id="erros">0</span></div>
        </div>

        <!-- Mensagem final -->
        <div
          id="mensagem-final"
          class="field-container"
          style="margin-top: 8px"
        ></div>

        <!-- Botões dentro do container -->
        <div class="button-group" style="margin-top: 20px">
          <button
            type="button"
            class="requisitos"
            onclick="location.href = 'arrastar-soltar-requisitos.html'"
          >
            Requisitos
          </button>
          <button type="button" onclick="location.href = '../../index.html'">
            Voltar
          </button>
          <button type="button" id="reiniciar">Reiniciar</button>
        </div>
      </div>
    </div>

    <!-- Modal compacta (sucesso, mensagens rápidas) -->
    <div id="modalMensagem" class="modal" style="display: none">
      <div class="modal-content large">
        <span id="modalFechar" class="close">&times;</span>
        <h2><p id="modalTitulo"></p></h2>
        <p id="modalTexto"></p>
        <div class="modal-actions">
          <button id="modalOk" type="button" class="btn-ok">OK</button>
        </div>
      </div>
    </div>

    <!-- Modal fluida (erros detalhados) -->
    <div id="modalMensagemErro" class="modal" style="display: none">
      <div class="modal-content large">
        <span id="modalFecharErro" class="close">&times;</span>
        <h2><p id="modalTituloErro"></p></h2>
        <p id="modalTextoErro"></p>
        <div class="modal-actions">
          <button id="modalOkErro" type="button" class="btn-ok">OK</button>
        </div>
      </div>
    </div>

    <script src="../js/arrastar-soltar.js"></script>
    <script src="../js/acessibilidade-global.js"></script>
  </body>
</html>
