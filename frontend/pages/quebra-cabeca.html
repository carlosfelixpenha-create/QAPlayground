<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QAPlayground - Quebra-Cabeça</title>

    <link rel="stylesheet" href="../css/style_global.css" />
    <link rel="stylesheet" href="../css/login.css" />
    <link rel="stylesheet" href="../css/responsividade-global.css" />
  </head>
  <body>
    <div class="login-content">
      <h1>Quebra-Cabeças</h1>

      <!-- CARD COM IDENTIDADE VISUAL -->
      <div class="quebra-card">
        <div class="jogo-wrapper">
          <!-- Bloco da esquerda -->
          <div class="lado-esquerdo">
            <h3>Escolha o nível do quebra-cabeça:</h3>

            <!-- Botões de níveis -->
            <div class="button-group" id="botoes-niveis">
              <button type="button" onclick="iniciarJogo(4)">4 peças</button>
              <button type="button" onclick="iniciarJogo(8)">8 peças</button>
              <button type="button" onclick="iniciarJogo(16)">16 peças</button>
              <button type="button" onclick="iniciarJogo(32)">32 peças</button>
            </div>

            <!-- Sub-wrapper: tabuleiro + referência -->
            <div class="tabuleiro-referencia">
              <!-- Tabuleiro -->
              <div id="tabuleiro" class="tabuleiro-container"></div>

              <!-- Referência -->
              <div class="referencia-container">
                <div id="referencia"></div>
              </div>
            </div>

            <!-- Mensagem de vitória -->
            <div id="mensagem"></div>

            <!-- Botões de navegação abaixo do tabuleiro -->
            <div class="button-group" id="botoes-navegacao">
              <button
                type="button"
                class="requisitos"
                onclick="location.href='quebra-cabeca-requisitos.html'"
              >
                Requisitos
              </button>
              <button type="button" onclick="location.href='../../index.html'">
                Voltar
              </button>
              <button type="button" id="embaralhar" disabled>Embaralhar</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Modal compacta (sucesso, mensagens rápidas) -->
    <div id="modalMensagem" class="modal" style="display: none">
      <div class="modal-content small">
        <span id="modalFechar" class="close">&times;</span>
        <p id="modalTexto"></p>
        <div class="modal-actions">
          <button id="modalOk" type="button" class="btn-ok">OK</button>
        </div>
      </div>
    </div>

    <!-- Modal fluida (erros detalhados) -->
    <div id="modalMensagemErro" class="modal" style="display: none">
      <div class="modal-content large">
        <span id="modalFecharErro" class="close">&times;</span>
        <h2>Erro no Quebra-Cabeça</h2>
        <p id="modalTextoErro"></p>
        <div class="modal-actions">
          <button id="modalOkErro" type="button" class="btn-ok">OK</button>
        </div>
      </div>
    </div>

    <script src="../js/quebra-cabeca.js"></script>
    <script src="../js/acessibilidade-global.js"></script>
  </body>
</html>
