<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QAPlayground - Formulário 3</title>
    <link rel="stylesheet" href="../css/style_global.css" />
    <link rel="stylesheet" href="../css/login.css" />
    <link rel="stylesheet" href="../css/responsividade-global.css" />
  </head>
  <body>
    <div class="login-content">
      <h1>Novos Campos</h1>
      <form
        onsubmit="executarFormulario3(event)"
        class="form-container"
        novalidate
      >
        <!-- Upload PDF -->
        <div class="field-container">
          <label for="arquivoPdf">Upload de Arquivo (PDF)*:</label>
          <input type="file" id="arquivoPdf" />
        </div>

        <!-- Upload DOCX -->
        <div class="field-container">
          <label for="arquivoDocx">Upload de Arquivo (DOCX)*:</label>
          <input type="file" id="arquivoDocx" />
        </div>

        <!-- Upload JPG -->
        <div class="field-container">
          <label for="arquivoJpg">Upload de Arquivo (JPG)*:</label>
          <input type="file" id="arquivoJpg" />
        </div>

        <!-- Upload XLSX -->
        <div class="field-container">
          <label for="arquivoXlsx">Upload de Arquivo (XLSX)*:</label>
          <input type="file" id="arquivoXlsx" />
        </div>

        <!-- Upload TXT -->
        <div class="field-container">
          <label for="arquivoTxt">Upload de Arquivo (TXT)*:</label>
          <input type="file" id="arquivoTxt" />
        </div>

        <!-- Select País / Estado / Cidade -->
        <div class="field-container">
          <label for="pais">País*:</label>
          <select id="pais" required>
            <option value="">Selecione...</option>
            <option value="brasil">Brasil</option>
            <option value="portugal">Portugal</option>
            <option value="eua">Estados Unidos</option>
          </select>

          <label for="estado">Estado*:</label>
          <select id="estado" required>
            <option value="">Selecione...</option>
          </select>

          <label for="cidade">Cidade*:</label>
          <select id="cidade" required>
            <option value="">Selecione...</option>
          </select>
        </div>

        <div class="button-group">
          <button
            type="button"
            class="requisitos"
            onclick="location.href='formulario-3-requisitos.html'"
          >
            Requisitos
          </button>
          <button type="button" onclick="location.href='../../index.html'">
            Voltar
          </button>
          <button type="submit">Enviar</button>
        </div>
      </form>
    </div>

    <!-- Modal compacta (sucesso, mensagens rápidas) -->
    <div id="modalMensagem" class="modal" style="display: none">
      <div class="modal-content small">
        <span id="modalFechar" class="close">&times;</span>
        <p id="modalTexto"></p>
        <div class="modal-actions">
          <button id="modalOk" type="button" class="btn-ok">OK</button>
        </div>
      </div>
    </div>

    <!-- Modal fluida (erros detalhados) -->
    <div id="modalMensagemErro" class="modal" style="display: none">
      <div class="modal-content large">
        <span id="modalFecharErro" class="close">&times;</span>
        <h2>Erro no Formulário 3</h2>
        <p id="modalTextoErro"></p>
        <div class="modal-actions">
          <button id="modalOkErro" type="button" class="btn-ok">OK</button>
        </div>
      </div>
    </div>

    <!-- Marca d'água -->
    <div class="marca-dagua esquerda"></div>
    <div class="marca-dagua direita"></div>

    <!-- Importa o JS externo -->
    <script src="../js/formulario-3.js"></script>
    <script src="../js/acessibilidade-global.js"></script>
  </body>
</html>
