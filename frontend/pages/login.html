<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QAPlayground - Login</title>
    <link rel="stylesheet" href="../css/style_global.css" />
    <link rel="stylesheet" href="../css/login.css" />
    <link rel="stylesheet" href="../css/responsividade-global.css" />
  </head>
  <body>
    <div class="login-content">
      <h1>Login</h1>
      <!-- novalidate desativa a validação automática do navegador -->
      <form onsubmit="executarLogin(event)" class="form-container" novalidate>
        <label for="usuario">Usuário*:</label>
        <input
          type="text"
          id="usuario"
          placeholder="Digite seu e-mail"
          required
        />

        <label for="senha">Senha*:</label>
        <div class="password-container">
          <input
            type="password"
            id="senha"
            placeholder="Digite sua senha"
            required
          />
          <button
            type="button"
            id="toggleSenha"
            class="toggle-btn"
            aria-label="Mostrar/ocultar senha"
          >
            👁️
          </button>
        </div>

        <!-- Captcha integrado -->
        <div class="form-row captcha-row">
          <input type="checkbox" id="captcha" />
          <label for="captcha">Sou humano</label>
          <img
            src="../img/logos/captcha.png"
            alt="Logo Captcha"
            class="captcha-logo"
          />
        </div>

        <div class="button-group">
          <button
            type="button"
            class="requisitos"
            onclick="location.href='login-requisitos.html'"
          >
            Requisitos
          </button>
          <button type="button" onclick="location.href='index.html'">
            Voltar
          </button>
          <button type="submit">Entrar</button>
        </div>
      </form>
    </div>

    <!-- Modal de mensagens rápidas (sucesso, info) -->
    <div id="modalMensagem" class="modal" style="display: none">
      <div class="modal-content small">
        <span id="modalFechar" class="close">&times;</span>
        <p id="modalTexto"></p>
        <div class="modal-actions">
          <button id="modalOk" type="button" class="btn-ok">OK</button>
        </div>
      </div>
    </div>

    <!-- Modal de erros (mensagens longas/detalhadas) -->
    <div id="modalMensagemErro" class="modal" style="display: none">
      <div class="modal-content large">
        <span id="modalFecharErro" class="close">&times;</span>
        <h2>Erro no Login</h2>
        <p id="modalTextoErro"></p>
        <div class="modal-actions">
          <button id="modalOkErro" type="button" class="btn-ok">OK</button>
        </div>
      </div>
    </div>

    <script src="../js/login.js"></script>
    <script src="../js/acessibilidade-global.js"></script>
  </body>
</html>
