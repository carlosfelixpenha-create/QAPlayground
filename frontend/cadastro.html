<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QAPlayground - Cadastro</title>
    <link rel="stylesheet" href="css/style_global.css" />
    <link rel="stylesheet" href="css/login.css" />
    <link rel="stylesheet" href="css/responsividade-global.css" />
  </head>
  <body>
    <div class="login-content">
      <h1>Cadastro</h1>
      <!-- novalidate desativa a validação automática do navegador -->
      <form
        onsubmit="executarCadastro(event)"
        class="form-container"
        novalidate
      >
        <label for="nome">Nome*:</label>
        <input type="text" id="nome" placeholder="Digite seu nome" required />

        <label for="email">E-mail*:</label>
        <input
          type="email"
          id="email"
          placeholder="Digite seu e-mail"
          required
        />

        <label for="senha">Senha*:</label>
        <input
          type="password"
          id="senha"
          placeholder="Digite sua senha"
          required
        />

        <label for="confirmarSenha">Confirmar sua senha*:</label>
        <input
          type="password"
          id="confirmarSenha"
          placeholder="Confirme sua senha"
          required
        />

        <!-- Botões principais -->
        <div class="button-group">
          <button
            type="button"
            class="requisitos"
            onclick="location.href='cadastro-requisitos.html'"
          >
            Requisitos
          </button>
          <button type="button" onclick="location.href='home.html'">
            Voltar
          </button>
          <!-- adicionamos id="btnCadastrar" -->
          <button type="submit" id="btnCadastrar">Cadastrar</button>
        </div>

        <!-- Botões de QA em outra linha -->
        <div class="button-group qa-buttons">
          <button
            type="button"
            id="btnVerUsuario"
            style="display: none"
            onclick="verUsuarioSalvo()"
          >
            Ver Usuário Salvo
          </button>
          <button
            type="button"
            id="btnLimparCadastro"
            style="display: none"
            onclick="limparCadastro()"
          >
            Limpar Cadastro
          </button>
        </div>
      </form>
    </div>

    <!-- Modal compacta (mensagens rápidas) -->
    <div id="modalMensagem" class="modal" style="display: none">
      <div class="modal-content small">
        <span id="modalFechar" class="close">&times;</span>
        <p id="modalTexto"></p>
        <div class="modal-actions">
          <button id="modalOk" type="button" class="btn-ok">OK</button>
        </div>
      </div>
    </div>

    <!-- Modal fluida (mensagens longas, erros detalhados) -->
    <div id="modalMensagemErro" class="modal" style="display: none">
      <div class="modal-content large">
        <span id="modalFecharErro" class="close">&times;</span>
        <h2>Erro no Cadastro</h2>
        <p id="modalTextoErro"></p>
        <div class="modal-actions">
          <button id="modalOkErro" type="button" class="btn-ok">OK</button>
        </div>
      </div>
    </div>

    <script src="cadastro.js"></script>
    <script src="acessibilidade-global.js"></script>
  </body>
</html>
