<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QAPlayground - Quebra-Cabeça</title>

  <link rel="stylesheet" href="style_global.css" />
  <link rel="stylesheet" href="login.css" />
</head>
<body>
  <div class="login-content">
    <h1>Quebra-Cabeça</h1>

    <!-- CARD COM IDENTIDADE VISUAL -->
    <div class="quebra-card">

      <div class="jogo-wrapper">

        <!-- Bloco da esquerda -->
        <div class="lado-esquerdo">
          <p id="texto-nivel"><h3>Escolha o nível do quebra-cabeça:</h3></p>

          <!-- Botões de níveis -->
          <div class="button-group" id="botoes-niveis">
            <button type="button" onclick="iniciarJogo(4)">4 peças</button>
            <button type="button" onclick="iniciarJogo(8)">8 peças</button>
            <button type="button" onclick="iniciarJogo(16)">16 peças</button>
            <button type="button" onclick="iniciarJogo(32)">32 peças</button>
          </div>

          <!-- Sub-wrapper: tabuleiro + referência -->
          <div class="tabuleiro-referencia">
            <!-- Tabuleiro -->
            <div id="tabuleiro" class="tabuleiro-container"></div>

            <!-- Referência -->
            <div class="referencia-container">
              <div id="referencia"></div>
            </div>
          </div>

          <!-- Mensagem de vitória (não será mais usada diretamente, mas mantida para consistência) -->
          <div id="mensagem"></div>

          <!-- Botões de navegação abaixo do tabuleiro -->
          <div class="button-group" id="botoes-navegacao">
            <button type="button" class="requisitos" onclick="location.href='quebra-cabeca-requisitos.html'">Requisitos</button>
            <button type="button" onclick="location.href='home.html'">Voltar</button>
            <button type="button" id="embaralhar" disabled>Embaralhar</button>
          </div>
        </div>

      </div>

    </div>
  </div>

  <!-- Modal de mensagem rápida -->
  <div id="modal-mensagem"></div>

  <script src="quebra-cabeca.js"></script>
</body>
</html>
