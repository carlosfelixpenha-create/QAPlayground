<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QAPlayground - Cadastro de Endereço</title>
    <link rel="stylesheet" href="style_global.css" />
    <link rel="stylesheet" href="login.css" />
  </head>
  <body>
    <div class="login-content">
      <h1>Cadastro de Endereço</h1>
      <!-- novalidate desativa a validação automática do navegador -->
      <form
        onsubmit="executarEndereco(event)"
        class="form-container"
        novalidate
      >
        <label for="logradouro">Logradouro*:</label>
        <input
          type="text"
          id="logradouro"
          placeholder="Rua, Avenida..."
          required
        />

        <label for="numero">Número*:</label>
        <input
          type="text"
          id="numero"
          placeholder="Número da residência"
          required
        />

        <label for="complemento">Complemento:</label>
        <input
          type="text"
          id="complemento"
          placeholder="Apartamento, bloco, etc."
        />

        <label for="bairro">Bairro*:</label>
        <input type="text" id="bairro" placeholder="Digite o bairro" required />

        <label for="cidade">Cidade*:</label>
        <input type="text" id="cidade" placeholder="Digite a cidade" required />

        <label for="estado">Estado*:</label>
        <input
          type="text"
          id="estado"
          placeholder="UF"
          maxlength="2"
          required
        />

        <label for="cep">CEP*:</label>
        <input
          type="text"
          id="cep"
          placeholder="Digite o CEP"
          maxlength="9"
          required
          oninput="mascaraCep(this)"
        />

        <!-- Botões principais -->
        <div class="button-group">
          <button
            type="button"
            class="requisitos"
            onclick="location.href='formulario-1-requisitos.html'"
          >
            Requisitos
          </button>
          <button type="button" onclick="location.href='home.html'">
            Voltar
          </button>
          <button type="submit" id="btnSalvar">Salvar</button>
        </div>

        <!-- Botões de QA -->
        <div class="button-group qa-buttons">
          <button
            type="button"
            id="btnVerEndereco"
            style="display: none"
            onclick="verEnderecoSalvo()"
          >
            Ver Endereço Salvo
          </button>
          <button
            type="button"
            id="btnLimparEndereco"
            style="display: none"
            onclick="limparEndereco()"
          >
            Limpar Endereço
          </button>
        </div>
      </form>
    </div>

    <!-- Modal compacta (sucesso, mensagens rápidas) -->
    <div id="modalMensagem" class="modal" style="display: none">
      <div class="modal-content small">
        <span id="modalFechar" class="close">&times;</span>
        <p id="modalTexto"></p>
        <div class="modal-actions">
          <button id="modalOk" type="button" class="btn-ok">OK</button>
        </div>
      </div>
    </div>

    <!-- Modal fluida (erros detalhados) -->
    <div id="modalMensagemErro" class="modal" style="display: none">
      <div class="modal-content large">
        <span id="modalFecharErro" class="close">&times;</span>
        <h2>Erro no Cadastro de Endereço</h2>
        <p id="modalTextoErro"></p>
        <div class="modal-actions">
          <button id="modalOkErro" type="button" class="btn-ok">OK</button>
        </div>
      </div>
    </div>

    <script src="formulario-1.js"></script>
    <script src="acessibilidade-global.js"></script>
    <script>
      // Função de máscara para CEP
      function mascaraCep(input) {
        let valor = input.value.replace(/\D/g, ""); // só números
        if (valor.length > 5) {
          input.value = valor.substring(0, 5) + "-" + valor.substring(5, 8);
        } else {
          input.value = valor;
        }
      }
    </script>
  </body>
</html>
